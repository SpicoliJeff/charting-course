<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Functional Fretboard – Stable Build + Pronunciation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #020617;
      --panel: #0b1120;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --cell-bg: #020617;
      --cell-hover: #111827;
      --root-outline: #f97316;
      --scale-outline: #22c55e;
      --chromatic-outline: #a78bfa;
      --triad-outline: #ffffff;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    header {
      padding: 1rem;
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #1e293b;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid #334155;
      font-size: 0.8rem;
    }

    select {
      background: #020617;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #1e293b;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid #334155;
      font-size: 0.8rem;
    }

    .toggle input {
      accent-color: #22c55e;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.2fr);
      gap: 1rem;
      padding: 1rem;
    }

    .fretboard-panel {
      background: var(--panel);
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      padding: 0.75rem;
      overflow: auto;
    }

    .theory-panel {
      background: var(--panel);
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .tab-buttons {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .tab-button {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid #334155;
      background: #020617;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tab-button.active {
      background: #22c55e;
      color: #020617;
      border-color: #22c55e;
    }

    .tab-panel {
      display: none;
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--muted);
    }

    .tab-panel.active {
      display: block;
    }

    .fretboard {
      display: grid;
      grid-template-columns: auto repeat(24, 1fr);
      gap: 2px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
    }

    .fret-label {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      text-align: center;
      padding: 0.25rem 0.15rem;
      color: var(--muted);
      border-right: 1px solid #1f2937;
    }

    .string-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
      color: var(--muted);
      border-bottom: 1px solid #1f2937;
    }

    .note-cell {
      min-width: 40px;
      min-height: 32px;
      border-radius: 0.35rem;
      background: var(--cell-bg);
      border: 1px solid #020617;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      position: relative;
    }

    .note-cell:hover {
      background: var(--cell-hover);
    }

    .note-pill {
      padding: 0.1rem 0.35rem;
      border-radius: 999px;
      font-size: 0.7rem;
      color: #020617;
      background: #38bdf8;
      white-space: nowrap;
    }

    .note-int-cents,
    .note-hz,
    .note-abs-cents {
      font-size: 0.65rem;
      color: var(--muted);
    }

    .note-root-outline {
      box-shadow: 0 0 0 2px var(--root-outline);
    }

    .note-scale-outline {
      box-shadow: 0 0 0 2px var(--scale-outline);
    }

    .note-chord-outline {
      box-shadow: 0 0 0 2px var(--triad-outline);
    }

    .note-chord-root {
      box-shadow: 0 0 0 2px var(--triad-outline), 0 0 0 4px var(--root-outline);
    }

    .note-chromatic-outline {
      box-shadow: 0 0 0 2px var(--chromatic-outline);
    }

    /* Pronunciation bubble */

    #pronunciation-bubble {
      position: absolute;
      transform: translate(-50%, -50%) scale(0.92);
      padding: 14px 18px;
      border-radius: 10px;
      max-width: 260px;
      text-align: center;
      line-height: 1.25;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      background: #e5e7eb;
      color: #020617;
      box-shadow: 0px 8px 18px rgba(0,0,0,0.25);
      transition:
        opacity 0.22s ease,
        transform 0.22s ease,
        box-shadow 0.18s ease;
    }

    #pronunciation-bubble.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    #pronunciation-bubble.closing {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.92);
    }

    #pronunciation-bubble .bubble-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 15px;
    }

    #pronunciation-bubble b {
      display: block;
      margin-top: 8px;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="controls-row">
      <div class="control-group">
        <span>Root</span>
        <select id="rootSelect"></select>
      </div>
      <div class="control-group">
        <span>Scale</span>
        <select id="scaleSelect"></select>
      </div>
      <div class="control-group">
        <span>Triad</span>
        <select id="triadSelect"></select>
      </div>
      <div class="control-group">
        <span>Chromatic</span>
        <select id="chromaticSelect"></select>
      </div>
    </div>

    <div class="controls-row">
      <label class="toggle">
        <input type="checkbox" id="toggleShowScale" checked />
        <span>Show Scale</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="toggleShowNoteNames" checked />
        <span>Show Note Names</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="toggleShowOctaves" checked />
        <span>Show Octaves</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="toggleShowHz" />
        <span>Show Hz</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="toggleShowAbsCents" />
        <span>Show Abs Cents</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="toggleShowIntCents" />
        <span>Show Int Cents</span>
      </label>
    </div>
  </header>

  <main>
    <section class="fretboard-panel">
      <div id="fretboard" class="fretboard"></div>
    </section>

    <section class="theory-panel">
      <div class="tab-buttons">
        <button class="tab-button active" data-tab="tab-scales">Scales</button>
        <button class="tab-button" data-tab="tab-theory">Theory</button>
        <button class="tab-button" data-tab="tab-triads">Triads</button>
        <button class="tab-button" data-tab="tab-intonation">Intonation</button>
        <button class="tab-button" data-tab="tab-pronunciation">Pronunciation</button>
      </div>

      <div id="tab-scales" class="tab-panel active"></div>
      <div id="tab-theory" class="tab-panel"></div>
      <div id="tab-triads" class="tab-panel"></div>
      <div id="tab-intonation" class="tab-panel"></div>
      <div id="tab-pronunciation" class="tab-panel">
        <h3>Pronunciation Engine</h3>
        <p>
          Double‑click any note on the fretboard to open its pronunciation bubble.
          Double‑click the same note again to close it, or click anywhere else to dismiss.
        </p>
        <p>
          The bubble adapts to register, string brightness, solfege function, and vowel feel.
        </p>
      </div>
    </section>
  </main>

  <!-- Pronunciation bubble -->
  <div id="pronunciation-bubble"></div>

  <script>
    // ---------- DATA ----------
    const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

    const SCALES = {
      "Ionian (Major)": [0,2,4,5,7,9,11],
      "Aeolian (Natural Minor)": [0,2,3,5,7,8,10]
      // extend with your full set
    };

    const TRIADS = {
      "Major Triad": [0,4,7],
      "Minor Triad": [0,3,7]
      // extend with your full set
    };

    function chromaticSet(name){
      if(name==="None") return [];
      if(name==="b2") return [1];
      if(name==="#2/b3") return [3];
      return [];
    }

    function noteIndex(note){
      return NOTES.indexOf(note);
    }

    function getSolfege(int, scaleName, scale){
      const major = scaleName.includes("Ionian") || scaleName.includes("Lydian") ||
                    scaleName.includes("Mixolydian") || scaleName.includes("Major");
      const minor = scaleName.includes("Aeolian") || scaleName.includes("Dorian") ||
                    scaleName.includes("Phrygian") || scaleName.includes("Locrian") ||
                    scaleName.includes("Minor");

      if(!scale.includes(int)) return "";

      const degree = scale.indexOf(int);
      if(major){
        return ["Do","Re","Mi","Fa","So","La","Ti"][degree] || "";
      }
      if(minor){
        return ["La","Ti","Do","Re","Mi","Fa","So"][degree] || "";
      }
      return "";
    }

    // ---------- FRETBOARD DATA ----------
    const fretboard = [];
    const strings = [
      { name: "E", octave: 2 },
      { name: "A", octave: 2 },
      { name: "D", octave: 3 },
      { name: "G", octave: 3 },
      { name: "B", octave: 3 },
      { name: "E", octave: 4 }
    ];

    function buildFretboardData(){
      for(let f=0; f<=24; f++){
        fretboard[f] = [];
        for(let s=0; s<strings.length; s++){
          const open = strings[s];
          const idx = (noteIndex(open.name) + f) % 12;
          const note = NOTES[idx];
          const octave = open.octave + Math.floor((noteIndex(open.name) + f) / 12);
          const freq = (440 * Math.pow(2, (noteIndex(note) - 9 + (octave-4)*12)/12)).toFixed(2);
          fretboard[f][s] = { note, octave, freq };
        }
      }
    }

    function renderFretboard(){
      const fb = document.getElementById("fretboard");
      fb.innerHTML = "";

      const corner = document.createElement("div");
      corner.className = "string-label";
      fb.appendChild(corner);

      for(let f=0; f<=24; f++){
        const fl = document.createElement("div");
        fl.className = "fret-label";
        fl.textContent = f;
        fb.appendChild(fl);
      }

      for(let s=0; s<strings.length; s++){
        const sl = document.createElement("div");
        sl.className = "string-label";
        sl.textContent = strings[s].name;
        fb.appendChild(sl);

        for(let f=0; f<=24; f++){
          const cell = document.createElement("div");
          cell.className = "note-cell";
          cell.dataset.fret = f;
          cell.dataset.stringIndex = s;
          const d = fretboard[f][s];
          cell.dataset.note = d.note;
          cell.dataset.octave = d.octave;
          fb.appendChild(cell);
        }
      }
    }

    // ---------- SELECTORS ----------
    function populateSelectors(){
      const rootSelect = document.getElementById("rootSelect");
      NOTES.forEach(n=>{
        const opt = document.createElement("option");
        opt.value = n;
        opt.textContent = n;
        rootSelect.appendChild(opt);
      });
      rootSelect.value = "A";

      const scaleSelect = document.getElementById("scaleSelect");
      Object.keys(SCALES).forEach(name=>{
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        scaleSelect.appendChild(opt);
      });

      const triadSelect = document.getElementById("triadSelect");
      Object.keys(TRIADS).forEach(name=>{
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        triadSelect.appendChild(opt);
      });

      const chromaticSelect = document.getElementById("chromaticSelect");
      ["None","b2","#2/b3"].forEach(name=>{
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        chromaticSelect.appendChild(opt);
      });
    }

    // ---------- UPDATE FRETBOARD ----------
    function updateFretboard(){
      const root=document.getElementById("rootSelect").value;
      const scaleName=document.getElementById("scaleSelect").value;
      const triadName=document.getElementById("triadSelect").value;
      const chromatic=document.getElementById("chromaticSelect").value;

      const showScale=document.getElementById("toggleShowScale").checked;
      const showNames=document.getElementById("toggleShowNoteNames").checked;
      const showOct=document.getElementById("toggleShowOctaves").checked;
      const showHz=document.getElementById("toggleShowHz").checked;
      const showAbs=document.getElementById("toggleShowAbsCents").checked;
      const showInt=document.getElementById("toggleShowIntCents").checked;

      const scale=SCALES[scaleName];
      const triad=TRIADS[triadName];
      const chroma=chromaticSet(chromatic);

      const rootIndex=noteIndex(root);

      const major = scaleName.includes("Ionian") || scaleName.includes("Lydian") ||
                    scaleName.includes("Mixolydian") || scaleName.includes("Major");
      const minor = scaleName.includes("Aeolian") || scaleName.includes("Dorian") ||
                    scaleName.includes("Phrygian") || scaleName.includes("Locrian") ||
                    scaleName.includes("Minor");

      document.querySelectorAll(".note-cell").forEach(cell=>{
        cell.innerHTML="";
        cell.className="note-cell";

        const f=Number(cell.dataset.fret);
        const s=Number(cell.dataset.stringIndex);
        const d=fretboard[f][s];

        const int=(noteIndex(d.note)-rootIndex+12)%12;
        const intCents=int*100;
        const absCents=noteIndex(d.note)*100;

        const inScale=scale.includes(int);
        const sol=inScale ? getSolfege(int,scaleName,scale) : "";
        cell.dataset.solfege = sol;

        if(showNames){
          const pill=document.createElement("div");
          pill.className="note-pill";
          pill.textContent = showOct
            ? (sol ? `${d.note}${d.octave} ${sol}` : `${d.note}${d.octave}`)
            : (sol ? `${d.note} ${sol}` : d.note);
          pill.style.background = (inScale && showScale) ? "#22c55e" : "#38bdf8";
          cell.appendChild(pill);
        }

        if(showInt && inScale && (major || minor)){
          const ic=document.createElement("div");
          ic.className="note-int-cents";
          ic.textContent=`${intCents}¢`;
          cell.appendChild(ic);
        }

        if(showHz){
          const hz=document.createElement("div");
          hz.className="note-hz";
          hz.textContent=`${d.freq}Hz`;
          cell.appendChild(hz);
        }

        if(showAbs){
          const ac=document.createElement("div");
          ac.className="note-abs-cents";
          ac.textContent=`${absCents}¢`;
          cell.appendChild(ac);
        }

        if (int === 0) cell.classList.add("note-root-outline");
        if (showScale && inScale) cell.classList.add("note-scale-outline");
        if (triad.includes(int)) cell.classList.add("note-chord-outline");
        if (triad[0] === int) cell.classList.add("note-chord-root");
        if (chroma.includes(int)) cell.classList.add("note-chromatic-outline");
      });
    }

    // ---------- THEORY PANEL ----------
    function updateTheoryPanel(tabId){
      const root=document.getElementById("rootSelect").value;
      const scaleName=document.getElementById("scaleSelect").value;
      const triadName=document.getElementById("triadSelect").value;

      const panelScales=document.getElementById("tab-scales");
      const panelTheory=document.getElementById("tab-theory");
      const panelTriads=document.getElementById("tab-triads");
      const panelIntonation=document.getElementById("tab-intonation");

      const major = scaleName.includes("Ionian") || scaleName.includes("Lydian") ||
                    scaleName.includes("Mixolydian") || scaleName.includes("Major");
      const minor = scaleName.includes("Aeolian") || scaleName.includes("Dorian") ||
                    scaleName.includes("Phrygian") || scaleName.includes("Locrian") ||
                    scaleName.includes("Minor");

      if(tabId==="tab-scales"){
        panelScales.innerHTML=`
          <h3>Scale Overview</h3>
          <p><strong>Root:</strong> ${root}</p>
          <p><strong>Scale:</strong> ${scaleName}</p>
          <p><strong>Pattern (semitones from root):</strong> ${SCALES[scaleName].join(" – ")}</p>
          <p><strong>Solfege Pattern:</strong><br>
            ${major ? "Do – Re – Mi – Fa – So – La – Ti" : ""}
            ${minor ? "La – Ti – Do – Re – Mi – Fa – So" : ""}
          </p>
          <p>Scale tones are outlined in green. The tonic (root) is outlined in orange.</p>
        `;
      }

      if(tabId==="tab-theory"){
        panelTheory.innerHTML=`
          <h3>Movable Do / La Theory</h3>

          <p><strong>Major-family scales</strong> (Ionian, Lydian, Mixolydian, labeled “Major”) use <strong>Movable-Do</strong>.<br>
          The selected root becomes <strong>Do</strong>, and the rest of the scale follows: Do–Re–Mi–Fa–So–La–Ti.</p>

          <p><strong>Minor-family scales</strong> (Aeolian, Dorian, Phrygian, Locrian, labeled “Minor”) use <strong>Movable-La</strong>.<br>
          The selected root becomes <strong>La</strong>, and the rest of the scale follows: La–Ti–Do–Re–Mi–Fa–So.</p>

          <p><strong>Solfege attaches directly to the note label</strong> so tonic function is visually bound to pitch.<br>
          Example: <code>A2 Do</code> in a major context, <code>A2 La</code> in a minor context.</p>

          <h4>Cents System</h4>
          <p><strong>Absolute cents</strong> (fixed): C=0¢, C#=100¢, …, A=900¢.<br>
          These are shown directly under the note (second line) and do not change with the chosen root.</p>

          <p><strong>Interval cents</strong> (0–1200¢): distance from the current tonic (Movable Do or La).<br>
          These are shown directly above the note when a movable major or minor scale is active.</p>

          <h4>Color Logic</h4>
          <p><span style="color:#f97316;">■</span> Root outline (tonic) – the functional home note.</p>
          <p><span style="color:#22c55e;">■</span> Scale tone outline – notes inside the current scale.</p>
          <p><span style="color:#ffffff;">■</span> Triad tone outline – chord tones of the selected triad.</p>
          <p><span style="color:#a78bfa;">■</span> Chromatic outline – notes at the selected chromatic interval from the root.</p>
        `;
      }

      if(tabId==="tab-triads"){
        panelTriads.innerHTML=`
          <h3>Triad Overview</h3>
          <p><strong>Triad Type:</strong> ${triadName}</p>
          <p><strong>Intervals (semitones from root):</strong> ${TRIADS[triadName].join(", ")}</p>
          <p>Triad tones are outlined in white. If the triad root matches the scale root, it shares the tonic outline, visually tying chord function to the tonal center.</p>
        `;
      }

      if(tabId==="tab-intonation"){
        panelIntonation.innerHTML=`
          <h3>Intonation Overview</h3>
          <p><strong>Hz:</strong> Each cell shows the equal-tempered frequency for that note and octave.</p>
          <p><strong>Absolute Cents:</strong> Fixed pitch-class position in the octave (C=0¢, C#=100¢, …, A=900¢). Shown directly under the note (second line).</p>
          <p><strong>Interval Cents:</strong> Distance from the selected tonic (0–1200¢). Shown directly above the note when a movable major or minor scale is active.</p>
        `;
      }
    }

    // ---------- TABS ----------
    document.addEventListener("click",e=>{
      if(!e.target.classList.contains("tab-button")) return;
      document.querySelectorAll(".tab-button").forEach(b=>b.classList.remove("active"));
      e.target.classList.add("active");
      const tab=e.target.dataset.tab;
      document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
      document.getElementById(tab).classList.add("active");
      updateTheoryPanel(tab);
    });

    // ---------- PRONUNCIATION BUBBLE ----------
    const bubble = document.getElementById("pronunciation-bubble");
    let activeNoteCell = null;

    function wirePronunciationBubbles() {
      document.querySelectorAll(".note-cell").forEach(cell => {
        cell.addEventListener("dblclick", () => {
          if (activeNoteCell === cell) {
            closeBubble();
            return;
          }

          activeNoteCell = cell;
          const noteData = extractNoteData(cell);
          const content = generateBubbleContent(noteData);
          openBubble(cell, content);
        });
      });
    }

    function extractNoteData(cell) {
      return {
        note: cell.dataset.note,
        octave: Number(cell.dataset.octave),
        stringIndex: Number(cell.dataset.stringIndex),
        solfege: cell.dataset.solfege || ""
      };
    }

    function openBubble(cell, content) {
      bubble.innerHTML = content;

      const rect = cell.getBoundingClientRect();
      bubble.style.left = `${rect.left + rect.width / 2}px`;
      bubble.style.top = `${rect.top + rect.height / 2}px`;

      bubble.classList.remove("closing");
      bubble.classList.add("visible");
    }

    function closeBubble() {
      if (!bubble.classList.contains("visible")) return;
      bubble.classList.add("closing");
      setTimeout(() => {
        bubble.classList.remove("visible", "closing");
        activeNoteCell = null;
      }, 220);
    }

    document.addEventListener("click", (e) => {
      if (!bubble.contains(e.target) && !e.target.classList.contains("note-cell")) {
        closeBubble();
      }
    });

    // ---------- FULL ADAPTIVE VOCAL ENGINE ----------
    function getRegister(octave) {
      if (octave <= 2) return "low";
      if (octave === 3) return "mid";
      if (octave === 4) return "high";
      return "very-high";
    }

    function getStringBrightness(stringIndex) {
      // 0 = low E, 5 = high E
      if (stringIndex <= 1) return "dark";
      if (stringIndex <= 3) return "neutral";
      return "bright";
    }

    function getVowelAdvice(solfege, register) {
      const base = solfege || "Do";
      const map = {
        "Do": "DO → “doh” → dʌʊ (think easy ‘doh’ not tense ‘doh!’).",
        "Re": "RE → “ray” → ɹeɪ (keep the jaw easy, don’t bite).",
        "Mi": "MI → “mee” → miː (narrow but not pinched; cheeks soft).",
        "Fa": "FA → “fah” → fɑː (drop the jaw, let it hang).",
        "So": "SO → “soh” → soʊ (round lips slightly, no squeeze).",
        "La": "LA → “lah” → lɑː (open, relaxed, like a sigh).",
        "Ti": "TI → “tee” → tiː (aim for ‘ih/ee’ blend, not laser‑sharp)."
      };
      let line = map[base] || `${base} → keep the vowel easy and centered.`;

      if (register === "high" || register === "very-high") {
        line += " In this register, let the vowel migrate slightly toward a warmer, more ‘uh/ah’ center instead of a bright laser point.";
      } else if (register === "low") {
        line += " In this register, resist the urge to over‑darken; keep a bit of brightness so the pitch stays clear.";
      }

      return line;
    }

    function getResonanceAdvice(register, brightness) {
      if (register === "low") {
        return "Resonance: aim for chest + low mask. Feel vibration in the sternum and lips, not buried in the throat.";
      }
      if (register === "mid") {
        return "Resonance: blend chest and head. Let the sound live behind the upper teeth and cheekbones, not pressed back.";
      }
      if (register === "high") {
        return "Resonance: think ‘top of the face’. Let the sound ring in the cheekbones and around the eyes, with the throat staying loose.";
      }
      // very-high
      return "Resonance: ultra‑light, almost whistle‑like. Let the sound float forward; no pushing, no grabbing, just a thin, ringing thread.";
    }

    function getTongueAdvice(solfege) {
      if (["Mi","Ti"].includes(solfege)) {
        return "Tongue: for MI/TI, keep the tongue high but relaxed, touching lightly behind the teeth, not jammed up.";
      }
      if (["La","Fa"].includes(solfege)) {
        return "Tongue: for LA/FA, let the tongue rest low and wide, tip touching gently at the bottom of the teeth.";
      }
      return "Tongue: let the tongue stay wide and relaxed, with the tip lightly at the lower teeth—no stiff arching.";
    }

    function getPitchFindingAdvice(note, octave, solfege) {
      const label = `${note}${octave}`;
      if (solfege) {
        return `Pitch‑finding: hear ${label} first as a pure pitch, then silently name it as “${solfege}” before you sing. Match the pitch, then add the label.`;
      }
      return `Pitch‑finding: hear ${label} in your head first, then slide up or down from a comfortable home note until it locks in.`;
    }

    function getMicroCoaching(register, brightness) {
      const lines = [];

      if (register === "low") {
        lines.push("Don’t over‑press; let the breath stay moving and the tone stay buoyant.");
      } else if (register === "mid") {
        lines.push("Think ‘easy speaking voice plus 10% energy’, not a different, ‘special’ voice.");
      } else if (register === "high") {
        lines.push("If it feels tight, back off the volume first, not the pitch. Lighter is safer.");
      } else {
        lines.push("Treat this as a gentle, exploratory note—light, curious, and reversible at any moment.");
      }

      if (brightness === "dark") {
        lines.push("On the lower strings, add a touch of mental brightness so the pitch doesn’t sink flat.");
      } else if (brightness === "bright") {
        lines.push("On the higher strings, avoid pushing; let the guitar’s brightness carry some of the clarity for you.");
      }

      return lines.join(" ");
    }

    function generateBubbleContent(data) {
      const register = getRegister(data.octave);
      const brightness = getStringBrightness(data.stringIndex);
      const vowelLine = getVowelAdvice(data.solfege, register);
      const resonanceLine = getResonanceAdvice(register, brightness);
      const tongueLine = getTongueAdvice(data.solfege);
      const pitchLine = getPitchFindingAdvice(data.note, data.octave, data.solfege);
      const microLine = getMicroCoaching(register, brightness);

      return `
        <div class="bubble-title">
          ${data.note}${data.octave}${data.solfege ? " — " + data.solfege : ""}
        </div>

        <b>Vowel Shape</b>
        ${vowelLine}

        <b>Resonance</b>
        ${resonanceLine}

        <b>Tongue / Jaw</b>
        ${tongueLine}

        <b>Pitch‑Finding</b>
        ${pitchLine}

        <b>Micro‑Coaching</b>
        ${microLine}
        Double‑click this note again to close the bubble.
      `;
    }

    // ---------- INIT ----------
    buildFretboardData();
    populateSelectors();
    renderFretboard();
    updateFretboard();
    updateTheoryPanel("tab-scales");
    wirePronunciationBubbles();

    document.querySelectorAll("select,input[type=checkbox]").forEach(el=>{
      el.addEventListener("change",()=>{
        updateFretboard();
        const activeTab=document.querySelector(".tab-button.active").dataset.tab;
        updateTheoryPanel(activeTab);
      });
    });
  </script>
</body>
</html>
