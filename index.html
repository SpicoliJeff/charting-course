<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Functional Fretboard – Vertical Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #111827;
      --bg-alt: #020617;
      --panel: #0b1120;
      --accent: #38bdf8;
      --accent-soft: #0ea5e9;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --grid-border: #1f2937;
      --cell-bg: #020617;
      --cell-hover: #111827;
      --root-outline: #f97316;
      --scale-outline: #22c55e;
      --chromatic-outline: #a78bfa;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000 100%);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #111827;
      background: linear-gradient(to right, #020617, #020617 40%, #0b1120 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .title-main {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .title-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
      border: 1px solid rgba(31, 41, 55, 0.9);
    }

    .control-group span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    select {
      background: #020617;
      border-radius: 999px;
      border: 1px solid #1f2937;
      color: var(--text);
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      cursor: pointer;
    }

    .toggle input { accent-color: var(--accent); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1rem;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .fretboard-card,
    .tabs-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }

    /* STRING LABEL ROW */
    .string-label-row {
      display: grid;
      grid-template-columns: 60px repeat(6, minmax(0, 110px));
      background: #0f172a;
      border-bottom: 1px solid var(--grid-border);
      padding: 0.4rem 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text);
      font-weight: 600;
    }

    /* FRETBOARD GRID */
    .fretboard-grid {
      display: grid;
      grid-template-columns: 60px repeat(6, minmax(0, 110px));
      grid-auto-rows: 42px;
      width: 100%;
      max-width: 100%;
      border: 1px solid var(--grid-border);
    }

    .fret-number {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: var(--muted);
      font-size: 0.75rem;
      border-bottom: 1px solid var(--grid-border);
      border-right: 1px solid var(--grid-border);
    }

    .note-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell-bg);
      border-bottom: 1px solid var(--grid-border);
      border-right: 1px solid var(--grid-border);
      transition: background 0.15s;
    }

    .note-cell:hover { background: var(--cell-hover); }

    .note-pill {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #000;
      z-index: 2;
    }

    .note-meta {
      position: absolute;
      bottom: 2px;
      left: 4px;
      font-size: 0.55rem;
      color: var(--muted);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      pointer-events: none;
      z-index: 1;
    }

    .note-solfege-tag {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.7);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.55rem;
      color: #fff;
      font-family: var(--font-mono);
    }

    .note-root-outline { outline: 2px solid var(--root-outline); outline-offset: -2px; }
    .note-scale-outline { outline: 2px solid var(--scale-outline); outline-offset: -2px; }
    .note-chord-outline { outline: 2px solid #fff; outline-offset: -2px; }
    .note-chord-root { outline: 2px solid var(--root-outline); outline-offset: -2px; }
    .note-chromatic-outline { outline: 2px solid var(--chromatic-outline); outline-offset: -2px; }

    .note-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      pointer-events: none;
    }

    .note-dot.circle { border-radius: 50%; }
    .note-dot.square { border-radius: 2px; }
    .note-dot.diamond { transform: rotate(45deg); border-radius: 2px; }

    .note-dot.top-left { top: 2px; left: 2px; }
    .note-dot.top-right { top: 2px; right: 2px; }
    .note-dot.bottom-left { bottom: 2px; left: 2px; }
    /* RESPONSIVE LAYOUT */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .tabs-card { order: 2; }
      .fretboard-card { order: 1; }
    }

    @media (max-width: 700px) {
      .string-label-row,
      .fretboard-grid {
        grid-template-columns: 40px repeat(6, minmax(0, 1fr));
      }
      .note-pill {
        font-size: 0.65rem;
        padding: 1px 4px;
      }
      .note-meta {
        font-size: 0.5rem;
        left: 2px;
      }
    }

    @media (max-width: 480px) {
      .string-label-row,
      .fretboard-grid {
        grid-template-columns: 32px repeat(6, minmax(0, 1fr));
      }
      .note-pill {
        font-size: 0.55rem;
        padding: 1px 3px;
      }
      .note-meta {
        font-size: 0.45rem;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .controls-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="title-block">
      <div class="title-main">Functional Fretboard</div>
      <div class="title-sub">Vertical • 24 Frets • Hz • Cents • Movable Do / La</div>
    </div>

    <div class="controls-row">
      <div class="control-group">
        <span>Root</span>
        <select id="rootSelect"></select>
      </div>

      <div class="control-group">
        <span>Scale</span>
        <select id="scaleSelect"></select>
      </div>

      <div class="control-group">
        <span>Triad</span>
        <select id="triadSelect"></select>
      </div>

      <div class="control-group">
        <span>Cycle</span>
        <select id="cycleSelect">
          <option value="none">None</option>
          <option value="cycle5">Cycle of 5ths</option>
          <option value="cycle4">Cycle of 4ths</option>
          <option value="maj3">Major 3rds</option>
          <option value="min3">Minor 3rds</option>
        </select>
      </div>

      <div class="control-group">
        <span>Chromatic</span>
        <select id="chromaticSelect">
          <option value="none">None</option>
          <option value="1">m2 (1)</option>
          <option value="2">M2 (2)</option>
          <option value="3">m3 (3)</option>
          <option value="4">M3 (4)</option>
          <option value="5">P4 (5)</option>
          <option value="6">Tritone (6)</option>
          <option value="7">P5 (7)</option>
          <option value="8">m6 (8)</option>
          <option value="9">M6 (9)</option>
          <option value="10">m7 (10)</option>
          <option value="11">M7 (11)</option>
          <option value="12">Octave (12)</option>
        </select>
      </div>

      <div class="control-group">
        <label class="toggle">
          <input type="checkbox" id="toggleShowScale" checked />
          <span>Scale</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleShowNoteNames" checked />
          <span>Names</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleShowOctaves" checked />
          <span>Octaves</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleShowHz" checked />
          <span>Hz</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleShowCents" checked />
          <span>Cents</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleMovableDo" checked />
          <span>Movable Do</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleMovableLa" checked />
          <span>Movable La</span>
        </label>
      </div>
    </div>
  </header>

  <main>
    <div class="layout">
      <section class="fretboard-card">
        <div class="string-label-row">
          <div></div>
          <div>E</div>
          <div>A</div>
          <div>D</div>
          <div>G</div>
          <div>B</div>
          <div>E</div>
        </div>

        <div class="fretboard-grid" id="fretboardGrid"></div>
      </section>

      <section class="tabs-card">
        <div class="tabs-header">
          <button class="tab-button active" data-tab="tab-scales">Scales</button>
          <button class="tab-button" data-tab="tab-theory">Theory</button>
          <button class="tab-button" data-tab="tab-triads">Triads</button>
          <button class="tab-button" data-tab="tab-intonation">Intonation</button>
        </div>

        <div class="tabs-body">
          <div id="tab-scales" class="tab-panel active"></div>
          <div id="tab-theory" class="tab-panel"></div>
          <div id="tab-triads" class="tab-panel"></div>
          <div id="tab-intonation" class="tab-panel"></div>
        </div>
      </section>
    </div>
  </main>
<script>
/* ============================
   NOTE + FREQUENCY ENGINE
============================ */
const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

function noteIndex(n){ return NOTES.indexOf(n); }
function noteAtIndex(i){ return NOTES[(i + 1200) % 12]; }

function frequencyFor(note, octave){
  const idx = noteIndex(note);
  const midi = (octave + 1) * 12 + idx;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function centsFromEqualTemperament(freq){
  return 0; // ET grid reference
}

/* ============================
   TUNING
============================ */
const TUNING = [
  { note:"E", octave:2 },
  { note:"A", octave:2 },
  { note:"D", octave:3 },
  { note:"G", octave:3 },
  { note:"B", octave:3 },
  { note:"E", octave:4 }
];

/* ============================
   BUILD FRETBOARD DATA
============================ */
const fretboard = [];

for(let fret=0; fret<=24; fret++){
  const row=[];
  for(let s=0; s<6; s++){
    const open=TUNING[s];
    const idx = noteIndex(open.note) + fret;
    const note = noteAtIndex(idx);
    const octave = open.octave + Math.floor((noteIndex(open.note)+fret)/12);
    const freq = frequencyFor(note, octave);
    const cents = centsFromEqualTemperament(freq);

    row.push({
      string:s,
      fret,
      note,
      octave,
      freq:freq.toFixed(2),
      cents
    });
  }
  fretboard.push(row);
}

/* ============================
   SCALES
============================ */
const SCALES = {
  "Ionian (Major)": [0,2,4,5,7,9,11],
  "Dorian": [0,2,3,5,7,9,10],
  "Phrygian": [0,1,3,5,7,8,10],
  "Lydian": [0,2,4,6,7,9,11],
  "Mixolydian": [0,2,4,5,7,9,10],
  "Aeolian (Natural Minor)": [0,2,3,5,7,8,10],
  "Locrian": [0,1,3,5,6,8,10]
};

/* ============================
   TRIADS
============================ */
const TRIADS = {
  "none": [],
  "Major": [0,4,7],
  "Minor": [0,3,7],
  "Diminished": [0,3,6],
  "Augmented": [0,4,8],
  "Sus2": [0,2,7],
  "Sus4": [0,5,7]
};

/* ============================
   CYCLES
============================ */
const CYCLES = {
  "none": [],
  "cycle5": [0,7,2,9,4,11,6,1,8,3,10,5],
  "cycle4": [0,5,10,3,8,1,6,11,4,9,2,7],
  "maj3": [0,4,8],
  "min3": [0,3,6,9]
};

/* ============================
   CHROMATIC
============================ */
function chromaticSet(n){
  if(n==="none") return [];
  return [Number(n)];
}

/* ============================
   SOLFEGE ENGINE
============================ */
function getSolfege(interval, scaleName, scale, movableDo, movableLa) {
  const degreeIndex = scale.indexOf(interval);
  if (degreeIndex === -1) return "";

  const isMajor =
    scaleName.includes("Ionian") ||
    scaleName.includes("Lydian") ||
    scaleName.includes("Mixolydian") ||
    scaleName.includes("Major");

  const isMinor =
    scaleName.includes("Aeolian") ||
    scaleName.includes("Dorian") ||
    scaleName.includes("Phrygian") ||
    scaleName.includes("Locrian") ||
    scaleName.includes("Minor");

  if (isMajor && movableDo) {
    const DO = ["Do","Re","Mi","Fa","So","La","Ti"];
    return DO[degreeIndex];
  }

  if (isMinor && movableLa) {
    const LA = ["La","Ti","Do","Re","Mi","Fa","So"];
    return LA[degreeIndex];
  }

  return "";
}

/* ============================
   UI POPULATION
============================ */
function populateSelectors(){
  const rootSel=document.getElementById("rootSelect");
  NOTES.forEach(n=>{
    const opt=document.createElement("option");
    opt.value=n;
    opt.textContent=n;
    rootSel.appendChild(opt);
  });

  const scaleSel=document.getElementById("scaleSelect");
  Object.keys(SCALES).forEach(s=>{
    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=s;
    scaleSel.appendChild(opt);
  });

  const triadSel=document.getElementById("triadSelect");
  Object.keys(TRIADS).forEach(t=>{
    const opt=document.createElement("option");
    opt.value=t;
    opt.textContent=t;
    triadSel.appendChild(opt);
  });
}

/* ============================
   RENDER GRID
============================ */
function renderFretboard(){
  const grid=document.getElementById("fretboardGrid");
  grid.innerHTML="";

  for(let fret=0; fret<=24; fret++){
    const num=document.createElement("div");
    num.className="fret-number";
    num.textContent=fret;
    grid.appendChild(num);

    for(let s=0; s<6; s++){
      const cell=document.createElement("div");
      cell.className="note-cell";
      cell.dataset.fret=fret;
      cell.dataset.string=s;
      grid.appendChild(cell);
    }
  }
}
/* ============================
   UPDATE FRETBOARD
============================ */
function updateFretboard(){
  const root = document.getElementById("rootSelect").value;
  const scaleName = document.getElementById("scaleSelect").value;
  const triadName = document.getElementById("triadSelect").value;
  const cycleName = document.getElementById("cycleSelect").value;
  const chromatic = document.getElementById("chromaticSelect").value;

  const showScale = document.getElementById("toggleShowScale").checked;
  const showNames = document.getElementById("toggleShowNoteNames").checked;
  const showOct = document.getElementById("toggleShowOctaves").checked;
  const showHz = document.getElementById("toggleShowHz").checked;
  const showCents = document.getElementById("toggleShowCents").checked;
  const movableDo = document.getElementById("toggleMovableDo").checked;
  const movableLa = document.getElementById("toggleMovableLa").checked;

  const scale = SCALES[scaleName];
  const triad = TRIADS[triadName];
  const cycle = CYCLES[cycleName];
  const chroma = chromaticSet(chromatic);

  const rootIndex = noteIndex(root);

  const cells = document.querySelectorAll(".note-cell");

  cells.forEach(cell=>{
    cell.innerHTML="";
    cell.className="note-cell";

    const fret = Number(cell.dataset.fret);
    const string = Number(cell.dataset.string);
    const data = fretboard[fret][string];

    const interval = (noteIndex(data.note) - rootIndex + 12) % 12;

    /* NOTE PILL */
    if (showNames) {
      const pill = document.createElement("div");
      pill.className = "note-pill";
      pill.textContent = showOct ? `${data.note}${data.octave}` : data.note;
      pill.style.background = showScale && scale.includes(interval)
        ? "#22c55e"
        : "#38bdf8";
      cell.appendChild(pill);
    }

    /* META (Hz + cents) */
    if (showHz || showCents) {
      const meta = document.createElement("div");
      meta.className = "note-meta";

      if (showHz) meta.innerHTML += `${data.freq}Hz`;
      if (showCents) meta.innerHTML += (showHz ? "<br>" : "") + `${data.cents}¢`;

      cell.appendChild(meta);
    }

    /* SOLFEGE (Movable Do / La) */
    const sol = getSolfege(interval, scaleName, scale, movableDo, movableLa);
    if (sol) {
      const tag = document.createElement("div");
      tag.className = "note-solfege-tag";
      tag.textContent = sol;
      cell.appendChild(tag);
    }

    /* OUTLINES */
    if (interval === 0) cell.classList.add("note-root-outline");
    if (showScale && scale.includes(interval)) cell.classList.add("note-scale-outline");
    if (triad.includes(interval)) cell.classList.add("note-chord-outline");
    if (triad[0] === interval) cell.classList.add("note-chord-root");
    if (chroma.includes(interval)) cell.classList.add("note-chromatic-outline");

    /* DOTS (simple always-on example) */
    const dot1 = document.createElement("div");
    dot1.className = "note-dot circle top-left";
    dot1.style.background = "#f97316";
    cell.appendChild(dot1);

    const dot2 = document.createElement("div");
    dot2.className = "note-dot diamond top-right";
    dot2.style.background = "#22c55e";
    cell.appendChild(dot2);

    const dot3 = document.createElement("div");
    dot3.className = "note-dot square bottom-left";
    dot3.style.background = "#a78bfa";
    cell.appendChild(dot3);
  });
}

/* ============================
   TABS (minimal wiring)
============================ */
document.addEventListener("click", e=>{
  if (e.target.classList.contains("tab-button")) {
    document.querySelectorAll(".tab-button").forEach(b=>b.classList.remove("active"));
    e.target.classList.add("active");

    const tab = e.target.dataset.tab;
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
    document.getElementById(tab).classList.add("active");
  }
});

/* ============================
   INIT
============================ */
populateSelectors();
renderFretboard();
updateFretboard();

document.querySelectorAll("select, input[type=checkbox]").forEach(el=>{
  el.addEventListener("change", updateFretboard);
});
</script>
</body>
</html>
