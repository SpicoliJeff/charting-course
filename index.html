<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Functional Fretboard – Modes, Triads, Cycles, Intonation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #111827;
      --bg-alt: #020617;
      --panel: #0b1120;
      --accent: #38bdf8;
      --accent-soft: #0ea5e9;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --grid-border: #1f2937;
      --cell-bg: #020617;
      --cell-bg-alt: #030712;
      --cell-hover: #111827;
      --root-outline: #f97316;
      --scale-outline: #22c55e;
      --chromatic-outline: #a78bfa;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #111827;
      background: linear-gradient(to right, #020617, #020617 40%, #0b1120 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .title-main {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .title-sub {
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: flex-end;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
      border: 1px solid rgba(31, 41, 55, 0.9);
    }

    .control-label {
      font-size: 0.75rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    select {
      background: #020617;
      border-radius: 999px;
      border: 1px solid #1f2937;
      color: #e5e7eb;
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      outline: none;
    }

    .toggle-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      color: #9ca3af;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      cursor: pointer;
      user-select: none;
    }

    .toggle input { accent-color: var(--accent); }

    /* ------------------------------
       LAYOUT + FRETBOARD + TABS CSS
       ------------------------------ */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1rem;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .fretboard-card,
    .tabs-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }

    .fretboard-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 0.75rem;
    }

    .fretboard-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .fretboard-subtitle {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .fretboard-meta {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
    }

    .fretboard-grid-wrapper {
      overflow-x: hidden;
      padding-bottom: 0.5rem;
    }

    .fretboard-grid {
      display: grid;
      grid-template-columns: repeat(25, 48px);
      grid-auto-rows: 42px;
      border: 1px solid var(--grid-border);
      width: 100%;
      max-width: 100%;
    }

    .fret-label,
    .fret-number,
    .string-label,
    .note-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--grid-border);
      border-bottom: 1px solid var(--grid-border);
      font-size: 0.75rem;
    }

    .fret-number {
      background: #0f172a;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .string-label {
      background: #0f172a;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .note-cell {
      position: relative;
      background: var(--cell-bg);
      transition: background 0.15s;
    }

    .note-cell:hover {
      background: var(--cell-hover);
    }

    .note-pill {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #000;
      font-weight: 600;
    }

    .note-meta {
      position: absolute;
      bottom: 2px;
      right: 2px;
      font-size: 0.55rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      font-family: var(--font-mono);
    }

    .note-solfege-tag,
    .note-interval-tag,
    .note-cycle-tag {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0,0,0,0.6);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.55rem;
      color: #fff;
    }

    .note-root-outline {
      outline: 2px solid var(--root-outline);
      outline-offset: -2px;
    }

    .note-scale-outline {
      outline: 2px solid var(--scale-outline);
      outline-offset: -2px;
    }

    .note-chord-outline {
      outline: 2px solid #fff;
      outline-offset: -2px;
    }

    .note-chord-root {
      outline: 2px solid var(--root-outline);
      outline-offset: -2px;
    }

    .note-chromatic-outline {
      outline: 2px solid var(--chromatic-outline);
      outline-offset: -2px;
    }

    /* ------------------------------
       TABS
       ------------------------------ */
    .tabs-header {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .tab-button {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .tab-button.active {
      background: var(--accent-soft);
      color: #000;
      border-color: var(--accent);
    }

    .tab-button span {
      font-size: 0.65rem;
      opacity: 0.8;
      display: block;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* ------------------------------
       ACCORDIONS
       ------------------------------ */
    .accordion {
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }

    .accordion-header {
      background: #0f172a;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .accordion-header span {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 400;
    }

    .accordion-body {
      padding: 0.6rem 0.75rem;
      background: #020617;
      font-size: 0.8rem;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .list-compact {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    .list-compact li {
      margin-bottom: 0.35rem;
      font-size: 0.8rem;
    }

    .pill {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e293b;
      color: #e5e7eb;
      font-size: 0.7rem;
      margin-right: 0.25rem;
    }

    .pill-mode {
      background: #334155;
    }

    .pill-int {
      background: #475569;
    }

    .pill-soft {
      background: #64748b;
    }

    .code-inline {
      font-family: var(--font-mono);
      background: #1e293b;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-left: 0.25rem;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      margin-bottom: 0.35rem;
    }

    .toggle-row input {
      accent-color: var(--accent);
    }

    .accordion-content {
      padding: 0.6rem 0.75rem;
      background: #020617;
      font-size: 0.8rem;
    }

    /* ============================================================
       PIECE 4 — DOT SHAPES + POSITIONS
       ============================================================ */
    .note-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      pointer-events: none;
    }

    .note-dot.circle {
      border-radius: 50%;
    }

    .note-dot.square {
      border-radius: 2px;
    }

    .note-dot.diamond {
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .note-dot.top-left {
      top: 2px;
      left: 2px;
    }

    .note-dot.top-right {
      top: 2px;
      right: 2px;
    }

    .note-dot.bottom-left {
      bottom: 2px;
      left: 2px;
    }
  </style>
</head>

<body>
  <header>
    <div class="title-block">
      <div class="title-main">Functional Fretboard</div>
      <div class="title-sub">
        Color‑coded notes • Modes • Movable‑Do/La • Triads • Cycles • Hz & Cents
      </div>
    </div>

    <div class="controls-row">
      <div class="control-group">
        <span class="control-label">Root</span>
        <select id="rootSelect"></select>
      </div>

      <div class="control-group">
        <span class="control-label">Scale / Mode</span>
        <select id="scaleSelect"></select>
      </div>

      <div class="control-group">
        <span class="control-label">Triad</span>
        <select id="triadSelect">
          <option value="">None</option>
        </select>
      </div>

      <div class="control-group">
        <span class="control-label">Cycle</span>
        <select id="cycleSelect">
          <option value="none">None</option>
          <option value="cycle5">Cycle of 5ths (7)</option>
          <option value="cycle4">Cycle of 4ths (5)</option>
          <option value="maj3">Major 3rds (4)</option>
          <option value="min3">Minor 3rds (3)</option>
        </select>
      </div>

      <div class="control-group">
        <span class="control-label">Chromatic</span>
        <select id="chromaticSelect">
          <option value="none">None</option>
          <option value="1">m2 (1)</option>
          <option value="2">M2 (2)</option>
          <option value="3">m3 (3)</option>
          <option value="4">M3 (4)</option>
          <option value="5">P4 (5)</option>
          <option value="6">Tritone (6)</option>
          <option value="7">P5 (7)</option>
          <option value="8">m6 (8)</option>
          <option value="9">M6 (9)</option>
          <option value="10">m7 (10)</option>
          <option value="11">M7 (11)</option>
          <option value="12">Octave (12)</option>
        </select>
      </div>

      <div class="control-group">
        <div class="toggle-group">
          <label class="toggle">
            <input type="checkbox" id="toggleShowScale" checked />
            <span>Show Scale</span>
          </label>

          <label class="toggle">
            <input type="checkbox" id="toggleShowNoteNames" checked />
            <span>Note Names</span>
          </label>

          <label class="toggle">
            <input type="checkbox" id="toggleShowOctaves" />
            <span>Octaves</span>
          </label>

          <label class="toggle">
            <input type="checkbox" id="toggleShowHz" checked />
            <span>Hz</span>
          </label>

          <label class="toggle">
            <input type="checkbox" id="toggleShowCents" checked />
            <span>Cents</span>
          </label>

          <label class="toggle">
            <input type="checkbox" id="toggleMovableDo" checked />
            <span>Movable Do</span>
          </label>

          <label class="toggle">
            <input type="checkbox" id="toggleMovableLa" />
            <span>Movable La</span>
          </label>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="layout">

      <!-- ===========================
           FRETBOARD CARD
      ============================ -->
      <section class="fretboard-card">
        <div class="fretboard-header">
          <div>
            <div class="fretboard-title">Fretboard View</div>
            <div class="fretboard-subtitle">
              6 strings • 24 frets • Equal temperament • A4 = 440 Hz
            </div>
          </div>

          <div class="fretboard-meta" id="fretboardMeta">
            Root: – • Scale: – • Triad: – • Cycle: – • Chromatic: –
          </div>
        </div>

        <div class="fretboard-grid-wrapper">
          <div class="fretboard-grid" id="fretboardGrid"></div>
        </div>
      </section>

      <!-- ===========================
           TABS CARD
      ============================ -->
      <section class="tabs-card">
        <div class="tabs-header">
          <button class="tab-button active" data-tab="tab-scales">
            Scales & Modes <span>Library</span>
          </button>

          <button class="tab-button" data-tab="tab-theory">
            Theory & Engines <span>Core</span>
          </button>

          <button class="tab-button" data-tab="tab-triads">
            Triads & Chords <span>Click‑to‑Highlight</span>
          </button>

          <button class="tab-button" data-tab="tab-intonation">
            Intonation & Hz <span>Cents</span>
          </button>
        </div>

        <div class="tabs-body">
          <div id="tab-scales" class="tab-panel active"></div>
          <div id="tab-theory" class="tab-panel">
            <!-- Dots & Overlays accordion -->
            <div class="accordion">
              <div class="accordion-header">
                <div>Dots & Overlays</div>
                <span>3‑dot system</span>
              </div>
              <div class="accordion-content">
                <label class="toggle-row">
                  <input type="checkbox" id="toggleTonalDots" checked>
                  <span>Show Tonal Function Dots (●)</span>
                </label>

                <label class="toggle-row">
                  <input type="checkbox" id="toggleModeDots" checked>
                  <span>Show Mode Dots (◆)</span>
                </label>

                <label class="toggle-row">
                  <input type="checkbox" id="toggleFamilyDots" checked>
                  <span>Show Family Dots (■)</span>
                </label>
              </div>
            </div>
          </div>
          <div id="tab-triads" class="tab-panel"></div>
          <div id="tab-intonation" class="tab-panel"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    /* ============================================================
       CORE CONSTANTS
       ============================================================ */
    const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const TUNING_MIDI = [40, 45, 50, 55, 59, 64]; // E2 A2 D3 G3 B3 E4
    const TOTAL_FRETS = 24;

    /* ------------------------------
       FAMILY COLORS (BASE)
       ------------------------------ */
    const FAMILY_COLORS = {
      diatonicMajor: "#3b82f6",
      diatonicMinor: "#8b5cf6",
      harmonicMinor: "#dc2626",
      melodicMinor: "#ec4899",
      pentatonic: "#f97316",
      japanese: "#ef4444",
      symmetric: "#eab308",
      dominant: "#22c55e",
      exotic: "#ff66cc"
    };

    function adjustColorLightness(hex, percent) {
      const num = parseInt(hex.replace("#", ""), 16);
      let r = (num >> 16) + Math.round(2.55 * percent);
      let g = ((num >> 8) & 0x00FF) + Math.round(2.55 * percent);
      let b = (num & 0x0000FF) + Math.round(2.55 * percent);

      r = Math.min(255, Math.max(0, r));
      g = Math.min(255, Math.max(0, g));
      b = Math.min(255, Math.max(0, b));

      return "#" + (b | (g << 8) | (r << 16)).toString(16).padStart(6, "0");
    }

    function shadeFamilyColor(baseColor, semitoneIndex) {
      const lighten = (semitoneIndex / 11) * 35;
      return adjustColorLightness(baseColor, lighten);
    }

    /* ------------------------------
       MODE COLORS (PASTEL)
       ------------------------------ */

      dorian:      "#b2f2bb",
      phrygian:    "#ffb3b3",

    /* ------------------------------

      fa:   "#7dd3fc",

      // Movable-La (Minor)

      ti_minor: "#f472b6",
      do_minor: "#fb7185",
      re_minor: "#e879f9",
      mi_minor: "#a5b4fc",

      sol_minor:"#8b5cf6"

    /* ------------------------------

    let showTonalDots  = true;

    /* ============================================================

    const SCALE_FAMILIES = {

        {

          scales: [
            {

    /* ============================================================
       SCALE INDEX + HELPERS
       ============================================================ */
    const SCALE_INDEX = {};
    SCALE_FAMILIES.scaleFamilies.forEach((family, fi) => {
      family.scales.forEach((scale, si) => {
        SCALE_INDEX[scale.id] = {
          ...scale,
          familyId: family.familyId,
          familyName: family.familyName,
          familyColor: family.familyColor,
          familyIndex: fi,
          scaleIndex: si
        };
      });
    });

    function parseIntervalPattern(pattern) {
      let p = pattern.trim();
      if (p.startsWith("(") && p.endsWith(")")) {
        p = p.slice(1, -1).trim();
      }
      const tokens = p.split(/\s+/);
      const steps = [];
      tokens.forEach(tok => {
        if (tok === "W") steps.push(2);
        else if (tok === "H") steps.push(1);
        else if (tok === "(W+H)" || tok === "W+H") steps.push(3);
      });
      const semis = [0];
      let sum = 0;
      for (let s of steps) {
        sum += s;
        if (sum < 12) semis.push(sum);
      }
      return semis;
    }

    function isMinorScaleFamily(familyId, scaleId) {
      if (!familyId) return false;
      if (familyId === "diatonicMinor" || familyId === "harmonicMinor" || familyId === "melodicMinor") return true;
      if (scaleId && scaleId.toLowerCase().includes("minor")) return true;
      return false;
    }

    /* ============================================================
       FRETBOARD ENGINE
       ============================================================ */
    const fretboardGridEl = document.getElementById("fretboardGrid");
    const rootSelectEl    = document.getElementById("rootSelect");
    const scaleSelectEl   = document.getElementById("scaleSelect");
    const triadSelectEl   = document.getElementById("triadSelect");
    const cycleSelectEl   = document.getElementById("cycleSelect");
    const chromaticSelectEl = document.getElementById("chromaticSelect");

    const toggleShowNoteNamesEl  = document.getElementById("toggleShowNoteNames");
    const toggleShowOctavesEl    = document.getElementById("toggleShowOctaves");
    const toggleShowHzEl         = document.getElementById("toggleShowHz");
    const toggleShowCentsEl      = document.getElementById("toggleShowCents");
    const toggleMovableDoEl      = document.getElementById("toggleMovableDo");
    const toggleMovableLaEl      = document.getElementById("toggleMovableLa");

    let currentRootIndex = 9; // A
    let currentScaleId   = "ionian";
    let currentTriad     = "";
    let currentCycle     = "none";
    let currentChromatic = "none";

    function buildRootSelect() {
      NOTES.forEach((n, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = n;
        rootSelectEl.appendChild(opt);
      });
      rootSelectEl.value = currentRootIndex;
    }

    function buildScaleSelect() {
      SCALE_FAMILIES.scaleFamilies.forEach(fam => {
        const group = document.createElement("optgroup");
        group.label = fam.familyName;
        fam.scales.forEach(scale => {
          const opt = document.createElement("option");
          opt.value = scale.id;
          opt.textContent = scale.name;
          group.appendChild(opt);
        });
        scaleSelectEl.appendChild(group);
      });
      scaleSelectEl.value = currentScaleId;
    }

    function buildTriadSelect() {
      const triads = [
        { value: "", label: "None" },
        { value: "maj", label: "Major" },
        { value: "min", label: "Minor" },
        { value: "dim", label: "Diminished" },
        { value: "aug", label: "Augmented" },
        { value: "sus2", label: "Sus2" },
        { value: "sus4", label: "Sus4" },

        { value: "maj7", label: "Major 7" },
        { value: "min7", label: "Minor 7" }
      ];
      triadSelectEl.innerHTML = "";
      triads.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.value;
        opt.textContent = t.label;
        triadSelectEl.appendChild(opt);
      });
      triadSelectEl.value = currentTriad;
    }

    function getNoteData(stringIndex, fret) {
      const midi = TUNING_MIDI[stringIndex] + fret;
      const semitone = (midi - 60 + 1200) % 12; // relative to C
      const noteName = NOTES[semitone];
      const octave = Math.floor(midi / 12) - 1;
      const freq = 440 * Math.pow(2, (midi - 69) / 12);
      const cents = 0; // equal temperament baseline
      return { midi, semitone, noteName, octave, freq, cents };
    }

    function getCurrentScaleInfo() {
      const scaleObj = SCALE_INDEX[currentScaleId];
      if (!scaleObj) return null;
      const familyId = scaleObj.familyId;
      const familyColor = scaleObj.familyColor;
      const modeColor = scaleObj.modeColor;
      const semis = parseIntervalPattern(scaleObj.intervalPattern);
      const isMinor = isMinorScaleFamily(familyId, scaleObj.id);

      const scaleSet = new Set(
        semis.map(s => (currentRootIndex + s) % 12)
      );

      return {
        scaleObj,
        familyId,
        familyColor,
        modeColor,
        semis,
        scaleSet,
        isMinor
      };
    }

    function getSolfegeForDegreeIndex(idx, isMinor) {
      if (!isMinor) {
        const names = ["do","re","mi","fa","sol","la","ti"];
        const key = names[idx] || null;
        if (!key) return null;
        return { label: key, color: TONAL_FUNCTION_COLORS[key] || "#ffffff" };
      } else {
        const names = ["la_minor","ti_minor","do_minor","re_minor","mi_minor","fa_minor","sol_minor"];
        const key = names[idx] || null;
        if (!key) return null;
        const labelMap = {
          la_minor: "la",
          ti_minor: "ti",
          do_minor: "do",
          re_minor: "re",
          mi_minor: "mi",
          fa_minor: "fa",
          sol_minor:"sol"
        };
        return { label: labelMap[key], color: TONAL_FUNCTION_COLORS[key] || "#ffffff" };
      }
    }

    /* ============================================================
       DOT RENDERING ENGINE
       ============================================================ */
    function createDot(shape, position, color) {
      const dot = document.createElement("div");
      dot.classList.add("note-dot", shape, position);
      dot.style.backgroundColor = color;
      return dot;
    }

    function renderDots(cell, noteData, scaleInfo, degreeIndex) {
      cell.querySelectorAll(".note-dot").forEach(d => d.remove());
      if (!scaleInfo) return;

      const { familyId, familyColor, modeColor, isMinor } = scaleInfo;

      // TONAL FUNCTION DOT
      if (showTonalDots && degreeIndex != null) {
        const sol = getSolfegeForDegreeIndex(degreeIndex, isMinor);
        if (sol && sol.color) {
          const dot = createDot("circle", "top-left", sol.color);
          cell.appendChild(dot);
        }
      }

      // MODE DOT
      if (showModeDots && modeColor) {
        const dot = createDot("diamond", "top-right", modeColor);
        cell.appendChild(dot);
      }

      // FAMILY DOT
      if (showFamilyDots && familyColor != null) {
        const shaded = shadeFamilyColor(familyColor, currentRootIndex);
        const dot = createDot("square", "bottom-left", shaded);
        cell.appendChild(dot);
      }
    }

    /* ============================================================
       TRIADS, CYCLES, CHROMATIC HELPERS
       (baseline implementations)
       ============================================================ */
    function getTriadIntervals(kind) {
      switch (kind) {
        case "maj":   return [0,4,7];
        case "min":   return [0,3,7];
        case "dim":   return [0,3,6];
        case "aug":   return [0,4,8];
        case "sus2":  return [0,2,7];
        case "sus4":  return [0,5,7];
        case "dom7":  return [0,4,7,10];
        case "maj7":  return [0,4,7,11];
        case "min7":  return [0,3,7,10];
        default:      return [];
      }
    }

    function getCycleSet(kind) {
      const set = new Set();
      if (kind === "cycle5") {
        let n = currentRootIndex;
        for (let i = 0; i < 7; i++) {
          set.add(n);
          n = (n + 7) % 12;
        }
      } else if (kind === "cycle4") {
        let n = currentRootIndex;
        for (let i = 0; i < 5; i++) {
          set.add(n);
          n = (n + 5) % 12;
        }
      } else if (kind === "maj3") {
        let n = currentRootIndex;
        for (let i = 0; i < 4; i++) {
          set.add(n);
          n = (n + 4) % 12;
        }
      } else if (kind === "min3") {
        let n = currentRootIndex;
        for (let i = 0; i < 3; i++) {
          set.add(n);
          n = (n + 3) % 12;
        }
      }
      return set;
    }

    /* ============================================================
       MAIN RENDER
       ============================================================ */
    function buildFretboardGridSkeleton() {
      fretboardGridEl.innerHTML = "";
      // Top row: empty corner + fret numbers 0–24
      const corner = document.createElement("div");
      corner.className = "fret-number";
      fretboardGridEl.appendChild(corner);
      for (let f = 0; f <= TOTAL_FRETS; f++) {
        const fn = document.createElement("div");
        fn.className = "fret-number";
        fn.textContent = f;
        fretboardGridEl.appendChild(fn);
      }

      // Strings (6 rows)
      const stringNames = ["E", "A", "D", "G", "B", "E"];
      for (let s = 0; s < 6; s++) {
        const label = document.createElement("div");
        label.className = "string-label";
        label.textContent = stringNames[s];
        fretboardGridEl.appendChild(label);

        for (let f = 0; f <= TOTAL_FRETS; f++) {
          const cell = document.createElement("div");
          cell.className = "note-cell";
          cell.dataset.string = s;
          cell.dataset.fret = f;
          fretboardGridEl.appendChild(cell);
        }
      }
    }

    function updateFretboard() {
      const scaleInfo = getCurrentScaleInfo();
      const triadIntervals = getTriadIntervals(currentTriad);
      const cycleSet = getCycleSet(currentCycle);
      const chromaticInterval = currentChromatic === "none" ? null : parseInt(currentChromatic, 10);

      const cells = fretboardGridEl.querySelectorAll(".note-cell");
      cells.forEach(cell => {
        const s = parseInt(cell.dataset.string, 10);
        const f = parseInt(cell.dataset.fret, 10);
        const noteData = getNoteData(s, f);

        cell.className = "note-cell";
        cell.innerHTML = "";

        const inScale = scaleInfo ? scaleInfo.scaleSet.has(noteData.semitone) : false;
        let degreeIndex = null;
        if (scaleInfo && inScale) {
          const rel = (noteData.semitone - currentRootIndex + 12) % 12;
          degreeIndex = scaleInfo.semis.indexOf(rel);
        }

        // Note pill
        if (toggleShowNoteNamesEl.checked || toggleShowOctavesEl.checked) {
          const pill = document.createElement("div");
          pill.className = "note-pill";
          pill.style.backgroundColor = inScale && toggleShowScaleEl.checked
            ? scaleInfo.modeColor || "#e5e7eb"
            : "#e5e7eb";
          pill.textContent = toggleShowNoteNamesEl.checked
            ? (toggleShowOctavesEl.checked ? `${noteData.noteName}${noteData.octave}` : noteData.noteName)
            : (toggleShowOctavesEl.checked ? noteData.octave : "");
          cell.appendChild(pill);
        }

        // Meta (Hz + cents)
        if (toggleShowHzEl.checked || toggleShowCentsEl.checked) {
          const meta = document.createElement("div");
          meta.className = "note-meta";
          if (toggleShowHzEl.checked) {
            meta.appendChild(document.createTextNode(`${noteData.freq.toFixed(1)} Hz`));
          }
          if (toggleShowCentsEl.checked) {
            const span = document.createElement("span");
            span.textContent = `${noteData.cents.toFixed(0)}¢`;
            meta.appendChild(span);
          }
          cell.appendChild(meta);
        }

        // Root outline
        if (noteData.semitone === currentRootIndex) {
          cell.classList.add("note-root-outline");
        }

        // Scale outline
        if (inScale && toggleShowScaleEl.checked) {
          cell.classList.add("note-scale-outline");
        }

        // Triad outline
        if (triadIntervals.length && inScale) {
          const rel = (noteData.semitone - currentRootIndex + 12) % 12;
          if (triadIntervals.includes(rel)) {
            cell.classList.add("note-chord-outline");
            if (rel === 0) {
              cell.classList.add("note-chord-root");
            }
          }
        }

        // Cycle tag
        if (currentCycle !== "none" && cycleSet.has(noteData.semitone)) {
          const tag = document.createElement("div");
          tag.className = "note-cycle-tag";
          tag.textContent = "◯";
          cell.appendChild(tag);
        }

        // Chromatic outline + label
        if (chromaticInterval != null) {
          const rel = (noteData.semitone - currentRootIndex + 12) % 12;
          if (rel === chromaticInterval % 12) {
            cell.classList.add("note-chromatic-outline");
            const tag = document.createElement("div");
            tag.className = "note-interval-tag";
            tag.textContent = chromaticInterval;
            cell.appendChild(tag);
          }
        }

        // Solfege tag (only one system active at a time)
        if (scaleInfo && inScale && degreeIndex != null) {
          let useMinor = scaleInfo.isMinor;
          if (toggleMovableDoEl.checked && !toggleMovableLaEl.checked) {
            useMinor = false;
          } else if (!toggleMovableDoEl.checked && toggleMovableLaEl.checked) {
            useMinor = true;
          }
          const sol = getSolfegeForDegreeIndex(degreeIndex, useMinor);
          if (sol) {
            const tag = document.createElement("div");
            tag.className = "note-solfege-tag";
            tag.textContent = sol.label;
            tag.style.backgroundColor = sol.color;
            cell.appendChild(tag);
          }
        }

        // Dots
        renderDots(cell, noteData, scaleInfo, degreeIndex);
      });

      // Meta line
      const scaleObj = SCALE_INDEX[currentScaleId];
      metaEl.textContent =
        `Root: ${NOTES[currentRootIndex]} • ` +
        `Scale: ${scaleObj ? scaleObj.name : "–"} • ` +
        `Triad: ${triadSelectEl.options[triadSelectEl.selectedIndex]?.textContent || "None"} • ` +
        `Cycle: ${cycleSelectEl.options[cycleSelectEl.selectedIndex]?.textContent || "None"} • ` +
        `Chromatic: ${chromaticSelectEl.options[chromaticSelectEl.selectedIndex]?.textContent || "None"}`;
    }

    /* ============================================================
       UI WIRING
       ============================================================ */
    rootSelectEl.addEventListener("change", () => {
      currentRootIndex = parseInt(rootSelectEl.value, 10);
      updateFretboard();
    });

    scaleSelectEl.addEventListener("change", () => {
      currentScaleId = scaleSelectEl.value;
      updateFretboard();
    });

    triadSelectEl.addEventListener("change", () => {
      currentTriad = triadSelectEl.value;
      updateFretboard();
    });

    cycleSelectEl.addEventListener("change", () => {
      currentCycle = cycleSelectEl.value;
      updateFretboard();
    });

    chromaticSelectEl.addEventListener("change", () => {
      currentChromatic = chromaticSelectEl.value;
      updateFretboard();
    });

    toggleShowScaleEl.addEventListener("change", updateFretboard);
    toggleShowNoteNamesEl.addEventListener("change", updateFretboard);
    toggleShowOctavesEl.addEventListener("change", updateFretboard);
    toggleShowHzEl.addEventListener("change", updateFretboard);
    toggleShowCentsEl.addEventListener("change", updateFretboard);

    // Movable-Do / Movable-La — only one active at a time
    toggleMovableDoEl.addEventListener("change", () => {
      if (toggleMovableDoEl.checked) {
        toggleMovableLaEl.checked = false;
      }
      updateFretboard();
    });

    toggleMovableLaEl.addEventListener("change", () => {
      if (toggleMovableLaEl.checked) {
        toggleMovableDoEl.checked = false;
      }
      updateFretboard();
    });

    // Piece 5 — dot toggles
    document.getElementById("toggleTonalDots").addEventListener("change", (e) => {
      showTonalDots = e.target.checked;
      updateFretboard();
    });

    document.getElementById("toggleModeDots").addEventListener("change", (e) => {
      showModeDots = e.target.checked;
      updateFretboard();
    });

    document.getElementById("toggleFamilyDots").addEventListener("change", (e) => {
      showFamilyDots = e.target.checked;
      updateFretboard();
    });

    // Tabs
    document.querySelectorAll(".tab-button").forEach(btn => {
      btn.addEventListener("click", () => {
        const tabId = btn.getAttribute("data-tab");
        document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(tabId).classList.add("active");
      });
    });

    // Simple accordion behavior
    document.querySelectorAll(".accordion-header").forEach(header => {
      header.addEventListener("click", () => {
        const body = header.nextElementSibling;
        if (!body) return;
        const isHidden = body.style.display === "none";
        body.style.display = isHidden ? "block" : "none";
      });
    });
    document.querySelectorAll(".accordion-content").forEach(body => {
      if (body.style.display === "") body.style.display = "block";
    });

    /* ============================================================
       INIT
       ============================================================ */
    buildRootSelect();
    buildScaleSelect();
    buildTriadSelect();
    buildFretboardGridSkeleton();
    updateFretboard();
  </script>
</body>
</html>
