<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Functional Fretboard – Movable Do / La</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #111827;
      --bg-alt: #020617;
      --panel: #0b1120;
      --accent: #38bdf8;
      --accent-soft: #0ea5e9;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --grid-border: #1f2937;
      --cell-bg: #020617;
      --cell-hover: #111827;
      --root-outline: #f97316;
      --scale-outline: #22c55e;
      --chromatic-outline: #a78bfa;
      --triad-outline: #ffffff;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000 100%);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #111827;
      background: linear-gradient(to right, #020617, #020617 40%, #0b1120 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .title-main {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .title-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
      border: 1px solid rgba(31, 41, 55, 0.9);
    }

    .control-group span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    select {
      background: #020617;
      border-radius: 999px;
      border: 1px solid #1f2937;
      color: var(--text);
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      cursor: pointer;
    }

    .toggle input { accent-color: var(--accent); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1rem;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .fretboard-card,
    .tabs-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }

    /* STRING LABEL ROW */
    .string-label-row {
      display: grid;
      grid-template-columns: 60px repeat(6, minmax(0, 110px));
      background: #0f172a;
      border-bottom: 1px solid var(--grid-border);
      padding: 0.4rem 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text);
      font-weight: 600;
    }

    /* FRETBOARD GRID */
    .fretboard-grid {
      display: grid;
      grid-template-columns: 60px repeat(6, minmax(0, 110px));
      grid-auto-rows: 42px;
      width: 100%;
      max-width: 100%;
      border: 1px solid var(--grid-border);
    }

    .fret-number {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: var(--muted);
      font-size: 0.75rem;
      border-bottom: 1px solid var(--grid-border);
      border-right: 1px solid var(--grid-border);
    }

    .note-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell-bg);
      border-bottom: 1px solid var(--grid-border);
      border-right: 1px solid var(--grid-border);
      transition: background 0.15s ease, outline-color 0.15s ease;
    }

    .note-cell:hover { background: var(--cell-hover); }

    .note-pill {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #000;
      z-index: 2;
      white-space: nowrap;
      transition: background 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    }

    /* Hz bottom-left */
    .note-hz {
      position: absolute;
      bottom: 2px;
      left: 4px;
      font-size: 0.55rem;
      color: var(--muted);
      font-family: var(--font-mono);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Absolute cents bottom-center */
    .note-abs-cents {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem;
      color: var(--muted);
      font-family: var(--font-mono);
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }

    /* Interval cents top-left */
    .note-int-cents {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 0.55rem;
      color: var(--muted);
      font-family: var(--font-mono);
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .note-int-cents.show {
      opacity: 1;
      transform: translateY(0);
    }

    .note-root-outline { outline: 2px solid var(--root-outline); outline-offset: -2px; }
    .note-scale-outline { outline: 2px solid var(--scale-outline); outline-offset: -2px; }
    .note-chord-outline { outline: 2px solid var(--triad-outline); outline-offset: -2px; }
    .note-chord-root { outline: 2px solid var(--root-outline); outline-offset: -2px; }
    .note-chromatic-outline { outline: 2px solid var(--chromatic-outline); outline-offset: -2px; }

    .note-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      pointer-events: none;
      transition: background 0.15s ease;
    }

    .note-dot.circle { border-radius: 50%; }
    .note-dot.square { border-radius: 2px; }
    .note-dot.diamond { transform: rotate(45deg); border-radius: 2px; }

    .note-dot.top-left { top: 2px; left: 2px; }
    .note-dot.top-right { top: 2px; right: 2px; }
    .note-dot.bottom-left { bottom: 2px; left: 2px; }

    /* Tabs + theory panel */
    .tabs-header {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .tab-button {
      flex: 1;
      padding: 0.35rem 0.5rem;
      font-size: 0.8rem;
      background: #020617;
      border: 1px solid #1f2937;
      color: var(--muted);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .tab-button.active {
      background: #0f172a;
      color: var(--text);
      border-color: var(--accent-soft);
    }

    .tabs-body {
      margin-top: 0.5rem;
    }

    .tab-panel {
      display: none;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .tab-panel.active {
      display: block;
    }

    /* Collapsible sections inside theory panel */
    .collapsible-section {
      border: 1px solid #1f2937;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      overflow: hidden;
      background: #020617;
    }

    .collapsible-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.5rem;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text);
      background: #020617;
    }

    .collapsible-header span.label {
      font-weight: 500;
    }

    .collapsible-header span.chevron {
      font-size: 0.7rem;
      color: var(--muted);
      transition: transform 0.15s ease;
    }

    .collapsible-header.open span.chevron {
      transform: rotate(90deg);
    }

    .collapsible-body {
      max-height: 0;
      overflow: hidden;
      padding: 0 0.5rem;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
      transition: max-height 0.2s ease, padding-top 0.2s ease, padding-bottom 0.2s ease;
    }

    .collapsible-body.open {
      padding-top: 0.35rem;
      padding-bottom: 0.4rem;
    }

    .theory-swatch-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.25rem;
    }

    .theory-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid #111827;
    }

    .panel-fade {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .panel-fade.active {
      opacity: 1;
      transform: translateY(0);
    }
    /* RESPONSIVE LAYOUT */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .tabs-card { order: 2; }
      .fretboard-card { order: 1; }
    }

    @media (max-width: 700px) {
      .string-label-row,
      .fretboard-grid {
        grid-template-columns: 40px repeat(6, minmax(0, 1fr));
      }
      .note-pill {
        font-size: 0.65rem;
        padding: 1px 4px;
      }
      .note-hz,
      .note-abs-cents,
      .note-int-cents {
        font-size: 0.5rem;
      }
    }

    @media (max-width: 480px) {
      .string-label-row,
      .fretboard-grid {
        grid-template-columns: 32px repeat(6, minmax(0, 1fr));
      }
      .note-pill {
        font-size: 0.55rem;
        padding: 1px 3px;
      }
      .note-hz,
      .note-abs-cents,
      .note-int-cents {
        font-size: 0.45rem;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .controls-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="title-block">
      <div class="title-main">Functional Fretboard</div>
      <div class="title-sub">Vertical • 24 Frets • Hz • Absolute Cents • Movable Do / La</div>
    </div>

    <div class="controls-row">
      <div class="control-group">
        <span>Root</span>
        <select id="rootSelect"></select>
      </div>

      <div class="control-group">
        <span>Scale</span>
        <select id="scaleSelect"></select>
      </div>

      <div class="control-group">
        <span>Triad</span>
        <select id="triadSelect"></select>
      </div>

      <div class="control-group">
        <span>Cycle</span>
        <select id="cycleSelect">
          <option value="none">None</option>
          <option value="cycle5">Cycle of 5ths</option>
          <option value="cycle4">Cycle of 4ths</option>
          <option value="maj3">Major 3rds</option>
          <option value="min3">Minor 3rds</option>
        </select>
      </div>

      <div class="control-group">
        <span>Chromatic</span>
        <select id="chromaticSelect">
          <option value="none">None</option>
          <option value="1">m2 (1)</option>
          <option value="2">M2 (2)</option>
          <option value="3">m3 (3)</option>
          <option value="4">M3 (4)</option>
          <option value="5">P4 (5)</option>
          <option value="6">Tritone (6)</option>
          <option value="7">P5 (7)</option>
          <option value="8">m6 (8)</option>
          <option value="9">M6 (9)</option>
          <option value="10">m7 (10)</option>
          <option value="11">M7 (11)</option>
          <option value="12">Octave (12)</option>
        </select>
      </div>

      <div class="control-group">
        <label class="toggle">
          <input type="checkbox" id="toggleShowScale" checked />
          <span>Scale</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleShowNoteNames" checked />
          <span>Names</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleShowOctaves" checked />
          <span>Octaves</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleShowHz" checked />
          <span>Hz</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleShowAbsCents" checked />
          <span>Abs¢</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleShowIntCents" checked />
          <span>Int¢</span>
        </label>
      </div>
    </div>
  </header>

  <main>
    <div class="layout">
      <section class="fretboard-card">
        <div class="string-label-row">
          <div></div>
          <div>E</div>
          <div>A</div>
          <div>D</div>
          <div>G</div>
          <div>B</div>
          <div>E</div>
        </div>

        <div class="fretboard-grid" id="fretboardGrid"></div>
      </section>

      <section class="tabs-card">
        <div class="tabs-header">
          <button class="tab-button active" data-tab="tab-scales">Scales</button>
          <button class="tab-button" data-tab="tab-theory">Theory</button>
          <button class="tab-button" data-tab="tab-triads">Triads</button>
          <button class="tab-button" data-tab="tab-intonation">Intonation</button>
        </div>

        <div class="tabs-body panel-fade active" id="tabsBody">
          <div id="tab-scales" class="tab-panel active"></div>
          <div id="tab-theory" class="tab-panel"></div>
          <div id="tab-triads" class="tab-panel"></div>
          <div id="tab-intonation" class="tab-panel"></div>
        </div>
      </section>
    </div>
  </main>
<script>
/* ============================
   NOTE + FREQUENCY ENGINE
============================ */
const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

function noteIndex(n){ return NOTES.indexOf(n); }
function noteAtIndex(i){ return NOTES[(i + 1200) % 12]; }

function frequencyFor(note, octave){
  const idx = noteIndex(note);
  const midi = (octave + 1) * 12 + idx;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

/* ============================
   TUNING
============================ */
const TUNING = [
  { note:"E", octave:2 },
  { note:"A", octave:2 },
  { note:"D", octave:3 },
  { note:"G", octave:3 },
  { note:"B", octave:3 },
  { note:"E", octave:4 }
];

/* ============================
   BUILD FRETBOARD DATA
============================ */
const fretboard = [];

for(let fret=0; fret<=24; fret++){
  const row=[];
  for(let s=0; s<6; s++){
    const open=TUNING[s];
    const idx = noteIndex(open.note) + fret;
    const note = noteAtIndex(idx);
    const octave = open.octave + Math.floor((noteIndex(open.note)+fret)/12);
    const freq = frequencyFor(note, octave);

    row.push({
      string:s,
      fret,
      note,
      octave,
      freq:freq.toFixed(2)
    });
  }
  fretboard.push(row);
}

/* ============================
   SCALES
============================ */
const SCALES = {
  "Ionian (Major)": [0,2,4,5,7,9,11],
  "Dorian": [0,2,3,5,7,9,10],
  "Phrygian": [0,1,3,5,7,8,10],
  "Lydian": [0,2,4,6,7,9,11],
  "Mixolydian": [0,2,4,5,7,9,10],
  "Aeolian (Natural Minor)": [0,2,3,5,7,8,10],
  "Locrian": [0,1,3,5,6,8,10]
};

/* ============================
   TRIADS
============================ */
const TRIADS = {
  "none": [],
  "Major": [0,4,7],
  "Minor": [0,3,7],
  "Diminished": [0,3,6],
  "Augmented": [0,4,8],
  "Sus2": [0,2,7],
  "Sus4": [0,5,7]
};

/* ============================
   CYCLES
============================ */
const CYCLES = {
  "none": [],
  "cycle5": [0,7,2,9,4,11,6,1,8,3,10,5],
  "cycle4": [0,5,10,3,8,1,6,11,4,9,2,7],
  "maj3": [0,4,8],
  "min3": [0,3,6,9]
};

/* ============================
   CHROMATIC
============================ */
function chromaticSet(n){
  if(n==="none") return [];
  return [Number(n)];
}

/* ============================
   SOLFEGE ENGINE
============================ */
function getSolfege(intervalSemitones, scaleName, scale) {
  const degreeIndex = scale.indexOf(intervalSemitones);
  if (degreeIndex === -1) return "";

  const isMajor =
    scaleName.includes("Ionian") ||
    scaleName.includes("Lydian") ||
    scaleName.includes("Mixolydian") ||
    scaleName.includes("Major");

  const isMinor =
    scaleName.includes("Aeolian") ||
    scaleName.includes("Dorian") ||
    scaleName.includes("Phrygian") ||
    scaleName.includes("Locrian") ||
    scaleName.includes("Minor");

  if (isMajor) {
    const DO = ["Do","Re","Mi","Fa","So","La","Ti"];
    return DO[degreeIndex];
  }

  if (isMinor) {
    const LA = ["La","Ti","Do","Re","Mi","Fa","So"];
    return LA[degreeIndex];
  }

  return "";
}

/* ============================
   UI POPULATION
============================ */
function populateSelectors(){
  const rootSel=document.getElementById("rootSelect");
  NOTES.forEach(n=>{
    const opt=document.createElement("option");
    opt.value=n;
    opt.textContent=n;
    rootSel.appendChild(opt);
  });

  const scaleSel=document.getElementById("scaleSelect");
  Object.keys(SCALES).forEach(s=>{
    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=s;
    scaleSel.appendChild(opt);
  });

  const triadSel=document.getElementById("triadSelect");
  Object.keys(TRIADS).forEach(t=>{
    const opt=document.createElement("option");
    opt.value=t;
    opt.textContent=t;
    triadSel.appendChild(opt);
  });
}

/* ============================
   RENDER GRID
============================ */
function renderFretboard(){
  const grid=document.getElementById("fretboardGrid");
  grid.innerHTML="";

  for(let fret=0; fret<=24; fret++){
    const num=document.createElement("div");
    num.className="fret-number";
    num.textContent=fret;
    grid.appendChild(num);

    for(let s=0; s<6; s++){
      const cell=document.createElement("div");
      cell.className="note-cell";
      cell.dataset.fret=fret;
      cell.dataset.string=s;
      grid.appendChild(cell);
    }
  }
}
